<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#13213B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="C-PRO I">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Plano C-PRO I</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F3F7F5; --sheet:#FFFFFF; --ink:#13213B; --muted:#5B6B7F;
  --dropout:#2F8A78; --dropout-soft:#D6EAE4; --line:#C9DCD5;
  --ok:#2C7A4B; --warn:#B07A00; --bad:#B23A2A; --warn-bg:#FFF4D6; --bad-bg:#FBE4E0; --ok-bg:#E2F2E8;
  --fill:#13213B;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0E1726; --sheet:#152238; --ink:#E8EEF6; --muted:#9AA9BC;
    --dropout:#5CC3AE; --dropout-soft:#1B3A3A; --line:#27405A;
    --ok:#6BCB8F; --warn:#E5B23C; --bad:#F07F6E; --warn-bg:#3A3015; --bad-bg:#3D1F1C; --ok-bg:#163223;
    --fill:#E8EEF6;
  }
}
:root[data-theme="dark"]{
  --paper:#0E1726; --sheet:#152238; --ink:#E8EEF6; --muted:#9AA9BC;
  --dropout:#5CC3AE; --dropout-soft:#1B3A3A; --line:#27405A;
  --ok:#6BCB8F; --warn:#E5B23C; --bad:#F07F6E; --warn-bg:#3A3015; --bad-bg:#3D1F1C; --ok-bg:#163223;
  --fill:#E8EEF6;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Schibsted Grotesk",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
.wrap{max-width:880px;margin:0 auto;padding:28px 18px 64px}
header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px}
h1{font-size:clamp(30px,6vw,46px);line-height:1.02;font-weight:800;letter-spacing:-0.02em;margin:0}
.lede{color:var(--muted);margin:8px 0 0;max-width:46ch}
.who{display:flex;gap:6px;flex-wrap:wrap}
.who button{border:1.5px solid var(--line);background:var(--sheet);border-radius:999px;padding:8px 16px;font-weight:600;cursor:pointer}
.who button[aria-pressed="true"]{background:var(--fill);color:var(--paper);border-color:var(--fill)}
.who button:focus-visible,.btn:focus-visible,.link:focus-visible{outline:3px solid var(--dropout);outline-offset:2px}

/* answer sheet */
.sheet{background:var(--sheet);border:1.5px solid var(--dropout);border-radius:6px;position:relative;overflow:hidden}
.sheet-head{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:14px 20px;border-bottom:1.5px solid var(--dropout);color:var(--dropout);font-weight:600;font-size:14px;background:repeating-linear-gradient(90deg,transparent 0 11px,var(--dropout-soft) 11px 12px)}
.sheet-head strong{color:var(--ink);font-size:16px;background:var(--sheet);padding:2px 8px;border-radius:3px}
.q{padding:20px;border-bottom:1px dashed var(--line);display:grid;grid-template-columns:34px 1fr;gap:4px 12px}
.q:last-of-type{border-bottom:0}
.qn{width:28px;height:28px;border:1.5px solid var(--dropout);color:var(--dropout);border-radius:4px;display:grid;place-items:center;font-weight:700;font-size:14px;margin-top:1px}
.qt{font-weight:600;margin:2px 0 2px}
.qh{color:var(--muted);font-size:14px;margin:0 0 10px}
.qbody{grid-column:2}
.opts{display:flex;flex-wrap:wrap;gap:8px 14px}
.bub{position:relative;display:inline-flex;align-items:center;gap:8px;cursor:pointer;padding:4px 2px;user-select:none}
.bub input{position:absolute;opacity:0;width:1px;height:1px}
.bub .c{width:22px;height:22px;border:1.5px solid var(--dropout);border-radius:50%;flex:none;display:grid;place-items:center;font-size:11px;font-weight:700;color:var(--dropout);transition:background .12s}
.bub input:checked + .c{background:var(--fill);border-color:var(--fill);color:transparent}
.bub input:focus-visible + .c{outline:3px solid var(--dropout);outline-offset:2px}
.bub.sq .c{border-radius:4px}
.opts.mods{flex-direction:column;align-items:stretch;gap:6px}
.opts.mods .bub{align-items:flex-start;padding:10px 12px;border:1.5px solid var(--line);border-radius:6px}
.opts.mods .bub .c{margin-top:2px}
.opts.mods .bub small{font-size:13px;line-height:1.35}
.grid{width:100%;border-collapse:collapse}
.grid-wrap{overflow-x:auto}
.grid th{font-size:13px;font-weight:600;color:var(--dropout);text-align:center;padding:0 6px 8px;white-space:nowrap}
.grid th:first-child{text-align:left}
.grid td{padding:7px 6px;border-top:1px solid var(--dropout-soft)}
.grid td:not(:first-child){text-align:center;width:84px}
.grid td .bub{justify-content:center}
.grid tr.miss td:first-child{color:var(--bad)}
input[type=date],input[type=number]{border:1.5px solid var(--line);background:var(--paper);border-radius:4px;padding:6px 8px;min-height:38px}
.inline{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:10px}
.bo-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:8px}
.link{background:none;border:0;padding:4px 0;color:var(--dropout);font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.actions{display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding:20px;border-top:1.5px solid var(--dropout);background:var(--dropout-soft)}
.btn{border:0;background:var(--fill);color:var(--paper);font-weight:700;padding:12px 22px;border-radius:4px;cursor:pointer;font-size:16px}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.err{color:var(--bad);font-weight:600;font-size:14px}

/* plan */
.verdict{border-radius:6px;padding:22px 22px 20px;margin-bottom:18px;border:1.5px solid}
.verdict.ok{background:var(--ok-bg);border-color:var(--ok)}
.verdict.warn{background:var(--warn-bg);border-color:var(--warn)}
.verdict.bad{background:var(--bad-bg);border-color:var(--bad)}
.verdict.neutral{background:var(--sheet);border-color:var(--dropout)}
.v-date{font-size:clamp(28px,5.5vw,40px);font-weight:800;letter-spacing:-0.02em;line-height:1.05;margin:2px 0 8px}
.v-tag{font-weight:700;font-size:14px}
.verdict.ok .v-tag{color:var(--ok)} .verdict.warn .v-tag{color:var(--warn)} .verdict.bad .v-tag{color:var(--bad)} .verdict.neutral .v-tag{color:var(--dropout)}
.verdict p{margin:6px 0 0;max-width:62ch}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:6px;overflow:hidden;margin-bottom:18px}
.facts div{background:var(--sheet);padding:12px 14px}
.facts b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.facts span{color:var(--muted);font-size:13px}
.track{background:var(--sheet);border:1px solid var(--line);border-radius:6px;padding:14px 16px;margin-bottom:18px}
.bar{height:10px;background:var(--dropout-soft);border-radius:99px;overflow:hidden;margin:8px 0 6px}
.bar i{display:block;height:100%;background:var(--dropout)}
h2{font-size:22px;margin:30px 0 10px;letter-spacing:-0.01em}
.week{background:var(--sheet);border:1px solid var(--line);border-radius:6px;margin-bottom:10px}
.week.now{border-color:var(--dropout);border-width:2px}
.week summary{list-style:none;cursor:pointer;padding:12px 16px;display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.week summary::-webkit-details-marker{display:none}
.week summary h3{margin:0;font-size:16px}
.week summary small{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.week .note{margin:0 16px 8px;color:var(--warn);font-size:14px;font-weight:600}
.items{list-style:none;margin:0;padding:0 8px 8px}
.items li{display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:start;padding:8px;border-top:1px solid var(--dropout-soft)}
.items li.done .it{text-decoration:line-through;color:var(--muted)}
.it{font-weight:500}
.it em{font-style:normal;color:var(--muted);font-size:13px;display:block}
.dur{font-size:13px;color:var(--muted);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.tag{display:inline-block;font-size:12px;font-weight:600;padding:1px 7px;border-radius:3px;margin-right:6px;vertical-align:1px;background:var(--dropout-soft);color:var(--dropout)}
.tag.sim{background:var(--warn-bg);color:var(--warn)}
.focus{display:flex;flex-wrap:wrap;gap:8px}
.focus span{border:1.5px solid var(--bad);color:var(--bad);border-radius:999px;padding:3px 12px;font-weight:600;font-size:14px}
.rules{background:var(--sheet);border:1px solid var(--line);border-radius:6px;padding:4px 18px}
.rules p{margin:12px 0}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;margin:22px 0 0}
.cmp{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin-bottom:16px}
.cmp .card{background:var(--sheet);border:1px solid var(--line);border-radius:6px;padding:16px}
.cmp .card h3{margin:0 0 6px}
.empty{background:var(--sheet);border:1.5px dashed var(--dropout);border-radius:6px;padding:26px;text-align:center}
.sync{font-size:13px;color:var(--muted);margin-top:4px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fill);color:var(--paper);padding:10px 16px;border-radius:4px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
@media (max-width:560px){
  .q{grid-template-columns:1fr}.qbody{grid-column:1}.qn{margin-bottom:4px}
  .grid td:not(:first-child){width:62px}.grid th{font-size:12px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.ro{background:var(--dropout-soft);color:var(--ink);border-radius:4px;padding:10px 14px;font-weight:600;margin:0 0 14px}
.userbar{display:flex;gap:10px;align-items:center;font-size:13px;color:var(--muted);margin-top:10px;flex-wrap:wrap}
.userbar img{width:22px;height:22px;border-radius:50%}
.login{max-width:440px;margin:0 auto}
.login .sheet{padding:32px 24px;text-align:center}
.login .sheet p{margin:0 0 20px}
.login .sheet .err,.login .sheet p:last-child{margin-bottom:0}
.wrap.login-mode{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;justify-content:center;padding-bottom:12vh}
.wrap.login-mode header.top{justify-content:center;text-align:center;margin-bottom:28px}
.wrap.login-mode .lede{margin-left:auto;margin-right:auto}
.gbtn{display:inline-flex;justify-content:center;align-items:center;gap:12px;border:1.5px solid var(--line);background:var(--sheet);color:var(--ink);font-weight:700;padding:12px 20px;border-radius:4px;cursor:pointer;font-size:16px}
.gbtn:focus-visible{outline:3px solid var(--dropout);outline-offset:2px}
.gbtn svg{width:20px;height:20px}
.who[hidden]{display:none}
.fab{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:20;display:inline-flex;align-items:center;gap:10px;border:0;background:var(--dropout);color:#fff;font-weight:700;font-size:15px;padding:13px 18px;border-radius:999px;cursor:pointer;box-shadow:0 6px 20px rgba(19,33,59,.28);transition:transform .15s}
.fab:hover{transform:translateY(-2px)}
.fab:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.fab svg{width:20px;height:20px;flex:none}
.fab small{font-weight:600;opacity:.9;background:rgba(255,255,255,.22);padding:2px 8px;border-radius:99px;font-size:12px}
.fab[hidden]{display:none}
.wrap{padding-bottom:96px}
.ebcard{display:flex;align-items:center;gap:16px;background:var(--sheet);border:1.5px solid var(--dropout);border-radius:8px;padding:14px 16px;margin-bottom:18px;cursor:pointer;width:100%;text-align:left;transition:transform .15s}
.ebcard:hover{transform:translateY(-1px)}
.ebcard:focus-visible{outline:3px solid var(--dropout);outline-offset:2px}
.ebcard b{display:block;font-size:16px}.ebcard span{color:var(--muted);font-size:14px}
.ebcard .go{margin-left:auto;font-weight:700;color:var(--dropout);white-space:nowrap}
.ring{--v:0;width:56px;height:56px;border-radius:50%;flex:none;display:grid;place-items:center;background:conic-gradient(var(--dropout) calc(var(--v)*1%),var(--dropout-soft) 0);transition:background .4s}
.ring i{font-style:normal;width:44px;height:44px;border-radius:50%;background:var(--sheet);display:grid;place-items:center;font-weight:700;font-size:13px;font-variant-numeric:tabular-nums}
.ebhero{display:flex;gap:18px;align-items:center;background:var(--sheet);border:1.5px solid var(--dropout);border-radius:8px;padding:18px;margin-bottom:16px}
.ebhero .ring{width:84px;height:84px}.ebhero .ring i{width:68px;height:68px;font-size:18px}
.ebhero h2{margin:0 0 4px;font-size:22px}.ebhero p{margin:0;color:var(--muted)}
.ebhero .btn{margin-top:10px;padding:9px 16px;font-size:14px}
.ebtools{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}
.chip{border:1.5px solid var(--line);background:var(--sheet);border-radius:999px;padding:6px 14px;font-weight:600;font-size:14px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--fill);color:var(--paper);border-color:var(--fill)}
.esec{background:var(--sheet);border:1px solid var(--line);border-radius:8px;margin-bottom:10px;overflow:hidden}
.esec[open]{border-color:var(--dropout)}
.esec summary{list-style:none;cursor:pointer;padding:14px 16px;display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center}
.esec summary::-webkit-details-marker{display:none}
.esec summary h3{margin:0;font-size:17px}
.esec summary .cnt{font-variant-numeric:tabular-nums;font-weight:700;color:var(--dropout)}
.esec summary .meta{grid-column:1/-1;color:var(--muted);font-size:13px}
.esec .pbar{grid-column:1/-1;height:6px;background:var(--dropout-soft);border-radius:99px;overflow:hidden}
.esec .pbar i{display:block;height:100%;width:0;background:var(--dropout);border-radius:99px;transition:width .35s ease}
.esec.full summary h3::after{content:" ✓";color:var(--ok)}
.esec.out{opacity:.7}
.chs{list-style:none;margin:0;padding:4px 8px 10px}
.chapli{border-radius:6px}
.chapli.hide{display:none}
.chap{display:grid;grid-template-columns:auto 1fr;align-items:stretch;border-radius:6px;transition:background .15s}
.chap:hover{background:var(--paper)}
.tkl{display:grid;place-items:center;padding:6px 6px 6px 10px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.tkl input{position:absolute;opacity:0;width:1px;height:1px}
.tk{width:26px;height:26px;border:2px solid var(--dropout);border-radius:7px;display:grid;place-items:center;transition:background .15s,transform .15s}
.tk svg{width:16px;height:16px;stroke:#fff;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:22;stroke-dashoffset:22;transition:stroke-dashoffset .25s ease .05s}
.tkl input:checked ~ .tk{background:var(--dropout);animation:pop .3s}
.tkl input:checked ~ .tk svg{stroke-dashoffset:0}
.tkl input:focus-visible ~ .tk{outline:3px solid var(--dropout);outline-offset:2px}
.tkl input:disabled ~ .tk{opacity:.5}
.ctb{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;padding:11px 10px 11px 4px;cursor:pointer;color:inherit;font:inherit;border-radius:6px}
.ctb:focus-visible{outline:3px solid var(--dropout);outline-offset:-2px}
.ctb .ct{font-weight:500;flex:1}
.chap.rd .ct{color:var(--muted);text-decoration:line-through}
.ctb .pg{font-size:12px;font-weight:600;color:var(--muted);background:var(--paper);border-radius:99px;padding:2px 9px;white-space:nowrap}
.ctb .chev{width:18px;height:18px;flex:none;stroke:var(--muted);stroke-width:2.5;fill:none;stroke-linecap:round;stroke-linejoin:round;transition:transform .2s}
.ctb[aria-expanded="true"] .chev{transform:rotate(180deg)}
.ebtxt{margin:2px 8px 12px 44px;padding:14px 16px;background:var(--paper);border-left:3px solid var(--dropout);border-radius:0 6px 6px 0;font-size:16px;line-height:1.65;overflow-wrap:anywhere}
.ebtxt[hidden]{display:none}
.ebtxt h4{margin:18px 0 6px;font-size:16px;color:var(--dropout)}
.ebtxt h4:first-child{margin-top:0}
.ebtxt p{margin:0 0 10px}
.ebtxt ul{margin:0 0 10px;padding-left:20px}
.ebtxt li{margin:2px 0}
.ebtxt figure{margin:10px 0;text-align:center}
.ebtxt img{max-width:100%;height:auto;border-radius:4px;background:#fff}
.ebtxt .done{margin-top:12px}
.ebtxt .msg{color:var(--muted);margin:0}
.ebadm{margin-top:24px;padding:12px 14px;border:1px dashed var(--line);border-radius:6px;font-size:14px;color:var(--muted)}
.ebadm input{margin:8px 0;max-width:100%}
@media (max-width:480px){.ebtxt{margin-left:8px}}
.esec .all{margin:0 16px 10px;font-size:13px}
@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.22)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.tk,.tk svg,.esec .pbar i,.ring,.fab,.ebcard{transition:none;animation:none!important}}
@media (max-width:480px){.ebhero{flex-direction:column;align-items:flex-start}.fab small{display:none}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>Plano de estudo<br>C-PRO I</h1>
      <p class="lede">Responda o cartão inicial uma vez. O plano sai calculado para o seu ritmo, com a data de prova que faz sentido.</p>
      <div class="userbar" id="userbar" hidden></div>
    </div>
    <nav class="who" id="who" aria-label="De quem é o plano" hidden>
      <button data-p="thais">Thaís</button>
      <button data-p="roberta">Roberta</button>
      <button data-p="cmp">As duas</button>
    </nav>
  </header>
  <main id="app"><div class="empty"><p>Carregando…</p></div></main>
</div>
<button class="fab" id="fab" type="button" hidden></button>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signInWithRedirect, getRedirectResult, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { initializeFirestore, persistentLocalCache, persistentMultipleTabManager, doc, onSnapshot, setDoc, getDoc, writeBatch } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

/* =====================================================================
   CONFIGURAÇÃO — preencha antes de subir (veja o LEIAME.md)
   Os mesmos e-mails precisam estar no firestore.rules.
   ===================================================================== */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyBeR91BjhEw9PMu8u2LwOHqwRyyDrpr5J4",
  authDomain: "estudos-12939.firebaseapp.com",
  projectId: "estudos-12939",
  storageBucket: "estudos-12939.firebasestorage.app",
  messagingSenderId: "581414821577",
  appId: "1:581414821577:web:25d56e3956a774da99b718",
};
const ACESSOS = {
  "thaisilvacunha@gmail.com": "thais",
  "betaa.meneses@gmail.com": "roberta",
};
const ADMINS = ["barukerstore@gmail.com"];   // vê e edita os dois planos
/* ===================================================================== */

const fbApp = initializeApp(FIREBASE_CONFIG);
const auth = getAuth(fbApp);
const fs = initializeFirestore(fbApp, { localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() }) });

/* ---------- conteúdo do curso (mapeado da plataforma Geração Bancária) ---------- */
const T = s => { const p = s.split(':').map(Number); return p.length===3 ? p[0]*3600+p[1]*60+p[2] : p[0]*60+p[1]; };
const TOPICS = [
  ['macro','Macroeconomia'],
  ['mat','Matemática financeira e HP12C'],
  ['rf','Renda fixa e produtos bancários'],
  ['trib','Tributação'],
  ['acoes','Ações, bolsa e ofertas públicas'],
  ['deriv','Derivativos e opções'],
  ['fundos','Fundos de investimento'],
  ['alt','Alternativos, digitais e exterior'],
  ['prev','Previdência complementar'],
  ['carteira','Gestão de carteira e risco'],
];
const TOPIC_LABEL = Object.fromEntries(TOPICS);
// ordem pedagógica: base do Maluf primeiro, produtos da Laíra, carteira por último

/* ---------- motor do plano ---------- */
function buildItems(a){
  const sp = Number(a.speed)||1;
  const f = tp => tp ? FACTOR[a.ratings[tp]||'javi'] : 1;
  const items = [];
  const useSim = mods(a).includes('sim');
  const incl = new Set(LESSONS.filter(L=>lessonOn(L,a)).map(L=>L.id));
  const order = Object.fromEntries(LESSONS.map((L,i)=>[L.id,i]));
  // âncora de cada seção do e-book: a última aula (na ordem do curso) que está no plano
  const ebAt = {};
  for(const E of EBOOK){
    const on = E.anchors.filter(id=>incl.has(id)).sort((x,y)=>order[x]-order[y]);
    if(on.length) (ebAt[on[on.length-1]] ||= []).push(E);
  }
  for(const L of LESSONS){
    if(!lessonOn(L,a)) continue;
    const h = (L.v/3600)/sp * f(L.tp);
    items.push({id:L.id, t:L.t, c:L.c, v:L.v, h: Math.max(h, L.tp? 0.15 : 0.05), kind:'aula', tp:L.tp});
    if(L.id==='m-calc2' && (a.ratings.mat==='nunca' || a.hp==='nao')){
      items.push({id:'hp-pratica', t: a.hp==='nao' ? 'Instalar um emulador de HP12C e refazer os exemplos das aulas' : 'Prática na HP12C: refazer os exemplos das aulas', c:'Prática', h:1.5, kind:'pratica'});
    }
    for(const E of (ebAt[L.id]||[])){
      const n = pagesCount(E.pages);
      items.push({id:'eb-'+E.k, t:`E-book: ${E.t}`, c:'E-book', h: Math.max(0.25, n*MIN_PAGINA[a.ratings[E.tp]||'javi']/60), kind:'ebook',
        pages:E.pages, note:`Págs. ${pagesTxt(E.pages)} do e-book (${n} páginas). Leia depois da aula e refaça os exemplos de cálculo.`});
    }
    if(L.id==='pp2' && useSim){
      items.push({id:'sim-diag', t:'Simulado diagnóstico', c:'Simulados', h:1.5, kind:'sim',
        note:'Não é pra medir nota. É pra ver o formato da prova antes de estudar e testar o login da plataforma de simulados.'});
    }
  }
  if(!useSim) return items;
  // simulado de manutenção a cada ~8h de conteúdo
  const out=[]; let acc=0, n=1; let started=false;
  for(const it of items){
    out.push(it);
    if(it.id==='sim-diag'){ started=true; continue; }
    if(!started) continue;
    acc += it.h;
    if(acc>=8){ out.push({id:'sim-m'+n, t:`Simulado de treino ${n} + revisão dos erros`, c:'Simulados', h:2, kind:'sim'}); n++; acc=0; }
  }
  const content = items.reduce((s,i)=>s+i.h,0);
  const finalH = Math.max(8, Math.round(content*0.25));
  const nf = Math.ceil(finalH/2.5);
  for(let k=1;k<=nf;k++) out.push({id:'sim-f'+k, t:`Simulado completo ${k} + revisão dos erros`, c:'Reta final', h:2.5, kind:'sim'});
  out.push({id:'rev-vespera', t:'Véspera: revisão leve da lista de erros e descanso', c:'Reta final', h:1, kind:'sim'});
  return out;
}

function inBlackout(d, bos){
  const s = ds(d);
  return bos.some(b => b.from && b.to && s>=b.from && s<=b.to);
}

function schedule(items, a){
  const days = new Set(a.days);
  const perDay = Number(a.hours)/Math.max(days.size,1);
  let d = pd(a.start||todayS());
  const segs = []; let i=0, left = items[0]?.h||0, guard=0;
  while(i<items.length && guard<500){
    guard++;
    if(days.has(String(d.getDay())) && !inBlackout(d, a.blackouts)){
      let cap = perDay;
      while(cap>1e-6 && i<items.length){
        // não começa um item com sobra de dia pequena demais, e não deixa uma cauda minúscula pro dia seguinte
        if(left>=items[i].h-1e-6 && cap<0.25 && left>cap) break;
        const take = (left>cap && left-cap<0.1) ? left : Math.min(cap, left);
        segs.push({id:items[i].id, date:ds(d), h:take});
        cap -= take; left -= take;
        if(left<=1e-6){ i++; left = items[i]?.h||0; }
      }
    }
    d = addD(d,1);
  }
  const end = segs.length ? pd(segs[segs.length-1].date) : pd(a.start);
  return {segs, end, perDay};
}

function availableHours(a, untilExclusive){
  const days = new Set(a.days); const perDay = Number(a.hours)/Math.max(days.size,1);
  let d = pd(a.start||todayS()), n=0, g=0;
  while(d<untilExclusive && g<800){ g++; if(days.has(String(d.getDay())) && !inBlackout(d,a.blackouts)) n++; d=addD(d,1); }
  return {count:n, hours:n*perDay};
}

function nextExamDay(end){ let d=addD(end,2); if(d.getDay()===0) d=addD(d,1); return d; }

function computePlan(a){
  const items = buildItems(a);
  const total = items.reduce((s,i)=>s+i.h,0);
  const video = items.reduce((s,i)=>s+(i.v||0),0);
  const sch = schedule(items, a);
  const rec = nextExamDay(sch.end);
  let verdict;
  if(a.examMode==='marcada' || a.examMode==='mente'){
    const ex = pd(a.examDate);
    const av = availableHours(a, ex);
    const ratio = av.hours/total;
    const days = Math.max(a.days.length,1);
    const needH = av.count ? Math.ceil((total/av.count)*days) : null;
    if(ratio>=1.1) verdict={cls:'ok', tag:'Fecha com folga', date:ex,
      txt:`No seu ritmo o conteúdo termina por volta de ${fdl(sch.end)}. A sobra até a prova vira mais simulado, não descanso.`};
    else if(ratio>=0.97) verdict={cls:'warn', tag:'Fecha, mas no limite', date:ex,
      txt:`Não tem margem pra semana perdida. Se atrasar mais de uns 3 dias de estudo, ${a.examMode==='marcada'?'remarque':'escolha outra data'}: a data que o seu ritmo sustenta é ${fdl(rec)}.`};
    else verdict={cls:'bad', tag:'Não fecha nesse ritmo', date:ex,
      txt: needH ? `Pra chegar pronta em ${fdl(ex)} seriam ~${needH}h por semana, não ${a.hours}h. No ritmo de agora, a data realista é ${fdl(rec)}.` : `Não sobra nenhum dia de estudo antes dessa data. No seu ritmo, a data realista é ${fdl(rec)}.`};
  } else {
    verdict={cls:'neutral', tag:'Data recomendada', date:rec,
      txt:`É quando o plano termina com ${a.hours}h por semana, já com a reta final de simulados. Agende com antecedência, vaga no fim do ano some rápido.`};
  }
  // focos
  const on = topicsOn(a);
  const focus = TOPICS.filter(([k])=>on.has(k) && a.ratings[k]==='nunca').map(([,l])=>l);
  return {items, total, video, sch, rec, verdict, focus};
}


/* ---------- persistência (Firestore) ---------- */
function setSync(msg){
  const el=document.getElementById('syncmsg'); if(el) el.textContent=msg;
}
async function persist(p){
  if(!canEdit(p)) return;
  setSync(navigator.onLine ? 'Salvando…' : 'Sem internet: salvo no aparelho, envia quando voltar');
  try{
    await setDoc(doc(fs,'perfis',p), state.profiles[p]);
    setSync('Tudo salvo');
  }catch(e){
    console.error(e);
    setSync('Não deu pra salvar. Saia e entre de novo; se continuar, avise o Vitor.');
  }
}
let unsubs=[];
function subscribe(){
  unsubs.forEach(u=>u()); unsubs=[];
  for(const p of Object.keys(PEOPLE)){
    unsubs.push(onSnapshot(doc(fs,'perfis',p), snap=>{
      const next = snap.exists() ? snap.data() : null;
      // no e-book o DOM já foi atualizado na hora do clique: não redesenha por eco do próprio salvamento
      const same = state.view==='ebook' && state.loaded[p] && JSON.stringify(next?.progress||{})===JSON.stringify(state.profiles[p]?.progress||{});
      state.profiles[p] = next;
      state.loaded[p] = true;
      if(same) return;
      if(state.cur===p || state.cur==='cmp') render();
    }, err=>{ console.error(err); state.loaded[p]=true; render(); }));
  }
}

    ${msg?`<p class="err" style="margin-bottom:0">${esc(msg)}</p>`:''}

  app.querySelector('#g').onclick = async ()=>{
    const prov = new GoogleAuthProvider(); prov.setCustomParameters({prompt:'select_account'});

    catch(e){
      if(e.code==='auth/popup-blocked' || e.code==='auth/operation-not-supported-in-this-environment'){ await signInWithRedirect(auth, prov); }

/* Cada aula é dividida entre dias/semanas por trechos CONSECUTIVOS do vídeo: o fim de um trecho é o começo do
   próximo e o último termina exatamente na duração da aula (ex.: aula de 1h = 0:00–40:00 e 40:00–1:00:00). */
function weekGroups(plan){
  const byId = Object.fromEntries(plan.items.map(i=>[i.id,i]));
  const weeks = new Map();          // semana -> Map(id -> {h, from, to})
  const firstWeek = {}, lastWeek = {}, parts = {};
  const cum = {};                   // horas de estudo já agendadas por item
  for(const s of plan.sch.segs){
    const it = byId[s.id];
    const wk = ds(monday(pd(s.date)));
    if(!weeks.has(wk)) weeks.set(wk, new Map());
    const m = weeks.get(wk);
    const before = cum[s.id]||0; cum[s.id] = before + s.h;
    const done = cum[s.id] >= it.h-1e-6;
    let from=null, to=null;
    if(it.v){
      const edge = x => x>=it.h-1e-6 ? it.v : Math.min(it.v, Math.round(it.v*x/it.h/60)*60);
      from = edge(before); to = done ? it.v : edge(cum[s.id]);
    }
    const cur = m.get(s.id);
    if(cur){ cur.h += s.h; cur.to = to; } else m.set(s.id, {h:s.h, from, to});
    if(!(s.id in firstWeek)) firstWeek[s.id]=wk; lastWeek[s.id]=wk;
    (parts[s.id] ||= new Set()).add(wk);
  }
  return {weeks, byId, firstWeek, lastWeek, parts};
}
const fdur = d => d>=3600 ? fclock(d) : `${Math.floor(d/60)}min${d%60?String(d%60).padStart(2,'0')+'s':''}`;
const fclock = t => { const h=Math.floor(t/3600), m=Math.floor(t%3600/60), sec=t%60; return h ? `${h}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}` : `${m}:${String(sec).padStart(2,'0')}`; };

function renderPlan(p, readOnly){
  const prof = state.profiles[p]; const a = prof.answers; const plan = computePlan(a);
  const prog = prof.progress||{};
  const {weeks, byId, firstWeek, lastWeek, parts} = weekGroups(plan);
  const doneH = plan.items.filter(i=>prog[i.id]).reduce((s,i)=>s+i.h,0);
  const today = todayS();
  const dueH = plan.sch.segs.filter(s=>s.date<today).reduce((s,x)=>s+x.h,0);
  const diff = doneH - dueH;
  let status = '';
  if(today > a.start){
    status = Math.abs(diff)<0.75 ? 'Em dia com o plano.' : diff>0 ? `${fh(diff)} na frente do plano.` : `${fh(-diff)} atrasada em relação ao plano.`;
  }
  const pct = Math.round(100*doneH/plan.total);
  const curWk = ds(monday(new Date()));
  const v = plan.verdict;

  // blackout notes per week
  const boNote = wk => {
    const s=pd(wk); let n=0; for(let i=0;i<7;i++){ if(inBlackout(addD(s,i),a.blackouts)) n++; }
    return n ? (n>=7 ? 'Semana sem estudo.' : `${n} dia(s) sem estudo nesta semana.`) : '';
  };
  // include fully-blacked-out weeks between start and end
  const allWeeks=[]; { let w=monday(pd(a.start)); const last=monday(plan.sch.end); while(w<=last){ allWeeks.push(ds(w)); w=addD(w,7);} }

  const weekHtml = allWeeks.map((wk,idx)=>{
    const m = weeks.get(wk); const s=pd(wk), e=addD(s,6);
    const note = boNote(wk);
    const tot = m ? [...m.values()].reduce((x,y)=>x+y.h,0) : 0;
    const fin = m ? [...m.keys()].filter(id=>lastWeek[id]===wk) : [];
    const allDone = fin.length>0 && fin.every(id=>prog[id]);
    const open = wk===curWk || (wk>curWk && idx<2) || (!m);
    const lis = m ? [...m.entries()].map(([id,seg])=>{
      const it = byId[id];
      const ps = [...parts[id]].sort(); const nth = ps.indexOf(wk)+1;
      const split = ps.length>1;
      const last = lastWeek[id]===wk;
      const cont = !split ? '' : ` (parte ${nth} de ${ps.length})`;
      const tagc = it.kind==='sim' ? 'tag sim' : 'tag';
      const dur = it.v
        ? `assistir ${fclock(seg.from)} → ${fclock(seg.to)}<br>(${fdur(seg.to-seg.from)} de vídeo)<br>~${fh(seg.h)} de estudo`
        : `~${fh(seg.h)}`;
      const box = last
        ? bub('chk_'+id, id, '', !!prog[id], 'checkbox', `data-chk="${id}" aria-label="Concluí ${esc(it.t)}" ${readOnly?'disabled':''}`)
        : `<span style="opacity:.35">${bub('x_'+id, id, '', false, 'checkbox', 'disabled')}</span>`;
      return `<li class="${prog[id]?'done':''}">
        ${box}
        <div class="it"><span class="${tagc}">${esc(it.c)}</span>${esc(it.t)}${cont}${it.note&&nth===1?`<em>${esc(it.note)}</em>`:''}${split&&!last?`<em>Continua na próxima semana, de onde parou: ${fclock(seg.to)}.</em>`:''}</div>
        <div class="dur">${dur}</div></li>`;
    }).join('') : '';
    return `<details class="week ${wk===curWk?'now':''}" ${open?'open':''}>
      <summary><h3>Semana ${idx+1} · ${fd(s)} a ${fd(e)}${allDone?' ✓':''}</h3><small>${tot?`~${fh(tot)} de estudo`:'—'}</small></summary>
      ${note?`<p class="note">${note}</p>`:''}
      ${lis?`<ul class="items">${lis}</ul>`:''}
    </details>`;
  }).join('');

  const certTxt = a.certs.includes('cpror') ? 'Como você já tem a C-PRO R, renda fixa, fundos e regulação viram revisão. O peso está em carteira, derivativos e alternativos.' : a.certs.includes('cpa') ? 'Com a CPA você já tem a base de produtos, mas a C-PRO I vai bem mais fundo em carteira e cálculo.' : '';
  const trabTxt = a.trab==='cliente' ? 'As questões em formato de conversa com cliente tendem a ser mais naturais pra quem atende no dia a dia. Mesmo assim, treine o formato nos simulados: a resposta certa é a da norma, não a do costume do banco.' : '';

  app.innerHTML = `
    ${readOnly?`<p class="ro">Você está vendo o plano de ${PEOPLE[p]}. Só ela marca o progresso.</p>`:''}
    <section class="verdict ${v.cls}" aria-live="polite">
      <div class="v-tag">${v.tag}</div>
      <div class="v-date">Prova: ${fdl(v.date)}</div>
      <p>${v.txt}</p>
    </section>
    <div class="facts">
      <div><b>~${fh(plan.total)}</b><span>de estudo no total</span></div>
      <div><b>${fv(plan.video)}</b><span>de vídeo (${String(a.speed).replace('.',',')}x)</span></div>
      <div><b>~${fh(plan.sch.perDay)}</b><span>por dia de estudo (${a.days.length} dias/semana)</span></div>
      <div><b>${fd(plan.sch.end)}</b><span>fim do plano</span></div>
    </div>
    <div class="track">
      <strong>${pct}% concluído</strong> <span style="color:var(--muted)">· ${fh(doneH)} de ~${fh(plan.total)}</span>
      <div class="bar"><i style="width:${pct}%"></i></div>
      <span style="font-size:14px">${status || (readOnly?'Ainda sem progresso marcado.':'Marque cada item quando terminar. O plano compara com o que estava previsto até hoje.')}</span>
    </div>
    ${(()=>{ const t=ebTotals(prog); return `<button type="button" class="ebcard" id="ebcard"><div class="ring" style="--v:${Math.round(100*t.d/t.t)}"><i>${Math.round(100*t.d/t.t)}%</i></div><div><b>E-book C-PRO I</b><span>${t.d} de ${t.t} capítulos lidos</span></div><span class="go">Abrir →</span></button>`; })()}
    ${plan.focus.length?`<h2>Onde vai seu maior esforço</h2><div class="focus">${plan.focus.map(f=>`<span>${esc(f)}</span>`).join('')}</div>
      <p style="color:var(--muted);font-size:14px">Esses temas recebem o dobro do tempo de vídeo. Se depois da aula ainda parecerem confusos, reassista antes de seguir.</p>`:''}
    ${certTxt||trabTxt?`<p>${certTxt} ${trabTxt}</p>`:''}
    <h2>Cronograma semana a semana</h2>
    ${weekHtml}
    <h2>Como usar o e-book</h2>
    <div class="rules">
      <p>O e-book resume o curso inteiro. Cada seção entra no cronograma logo depois da aula do mesmo tema: assista, depois leia a seção, anotando o que errar nos exemplos.</p>
      ${mods(a).includes('sim')?`<p>Faça o diagnóstico logo no começo, antes de estudar. Ele serve pra conhecer o formato da prova nova, com diálogo de cliente e árvore de decisão, e pra confirmar que o login da plataforma de simulados funciona.</p>
      <p>Toda questão errada vai pra uma lista com o tema ao lado. No fim de cada semana, revise a lista inteira, não só os erros novos.</p>
      <p>O banco de questões repete bastante. Nota alta depois de vários simulados pode ser só memória. O sinal confiável é acertar questão que você nunca viu.</p>`:''}
    </div>
    <p style="color:var(--muted);font-size:14px;margin-top:18px">Como o tempo é calculado: cada hora de vídeo, na velocidade escolhida, vira ~2h de estudo em tema que você nunca viu, ~1h30 no que já viu e ~1h no que domina. O e-book conta ~2 min por página (3 min se for tema novo, 1 min se você domina). Aula longa que não cabe num dia continua de onde parou, sem repetir nem pular trecho. Feriados não estão descontados; use como dia extra.</p>
    <div class="toolbar">
      ${readOnly?'':'<button class="btn ghost" id="edit">Refazer o cartão inicial</button>'}
      <button class="btn ghost" id="copy">Copiar resumo para o WhatsApp</button>
    </div>`;
  app.querySelectorAll('[data-chk]').forEach(c=>c.addEventListener('change',()=>{
    const id=c.dataset.chk; prof.progress = prof.progress||{};
    if(c.checked) prof.progress[id]=true; else delete prof.progress[id];
    if(id.startsWith('eb-')){ const k=id.slice(3); (CHAPTERS[k]||[]).forEach((_,i)=>{ if(c.checked) prof.progress[chKey(k,i)]=true; else delete prof.progress[chKey(k,i)]; }); }

}

function renderEbook(p, readOnly){
  const ensure = () => { if(!state.profiles[p]) state.profiles[p]={progress:{},savedAt:new Date().toISOString()}; state.profiles[p].progress ||= {}; return state.profiles[p]; };
  const prog = state.profiles[p]?.progress || {};
  const a = state.profiles[p]?.answers;
  const plan = a ? computePlan(a) : null;
  const wkOf = plan ? weekGroups(plan).firstWeek : {};
  const t = ebTotals(prog); const pct = Math.round(100*t.d/t.t);
  const secHtml = EBOOK.map(E=>{
    const chs = CHAPTERS[E.k]; const st=t.by[E.k];
    const inPlan = plan ? plan.items.some(i=>i.id==='eb-'+E.k) : true;
    const wk = wkOf['eb-'+E.k];
    const meta = `Págs. ${pagesTxt(E.pages)}${plan ? (inPlan ? (wk?` · no plano: semana de ${fd(pd(wk))}`:'') : ' · fora do plano (módulo não escolhido)') : ''}`;
    const firstOpen = st.d<st.t && EBOOK.find(x=>t.by[x.k].d<t.by[x.k].t)===E;
    return `<details class="esec ${st.d===st.t?'full':''} ${inPlan?'':'out'}" data-k="${E.k}" ${firstOpen?'open':''}>
      <summary><h3>${esc(E.t)}</h3><span class="cnt">${st.d}/${st.t}</span><span class="meta">${esc(meta)}</span><span class="pbar"><i style="width:${Math.round(100*st.d/st.t)}%"></i></span></summary>
      <ul class="chs">${chs.map(([title,pg],i)=>{ const on=!!prog[chKey(E.k,i)]; return `<li class="chapli" data-k="${E.k}" data-i="${i}">
        <div class="chap ${on?'rd':''}" data-i="${i}">
          <label class="tkl"><input type="checkbox" data-k="${E.k}" data-i="${i}" ${on?'checked':''} ${readOnly?'disabled':''} aria-label="Li: ${esc(title)}">
            <span class="tk" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 12.5l5 5L20 6.5"/></svg></span></label>
          <button type="button" class="ctb" aria-expanded="false"><span class="ct">${esc(title)}</span><span class="pg">págs. ${esc(pg)}</span>
            <svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button>
        </div>
        <div class="ebtxt" hidden></div></li>`; }).join('')}</ul>
      ${readOnly?'':`<button type="button" class="link all" data-all="${E.k}">Marcar a seção toda como lida</button>`}
    </details>`;
  }).join('');
  app.innerHTML = `
    ${readOnly?`<p class="ro">Você está vendo o e-book de ${PEOPLE[p]}. Só ela marca o que leu.</p>`:''}
    <div class="ebhero"><div class="ring" id="ering" style="--v:${pct}"><i id="epct">${pct}%</i></div>
      <div><h2>E-book C-PRO I</h2><p id="esum">${t.d} de ${t.t} capítulos lidos</p>
      <button type="button" class="btn" id="enext">${t.d===t.t?'Tudo lido! 🎉':'Continuar de onde parei'}</button></div></div>
    <div class="ebtools"><button type="button" class="chip" data-f="all" aria-pressed="true">Todos</button><button type="button" class="chip" data-f="todo" aria-pressed="false">Falta ler</button></div>
    ${secHtml}
    ${state.isAdmin?`<div class="ebadm"><strong>Administração do e-book</strong><br>Importa o texto dos capítulos (arquivo ebook-content.json) para o Firestore. Só o admin vê isto.<br>
      <input type="file" id="ebfile" accept="application/json"> <button type="button" class="btn ghost" id="ebimp" style="padding:8px 14px;font-size:14px">Importar</button> <span id="ebst"></span></div>`:''}`;
  let filter='all';
  const refresh = () => {
    const pr = state.profiles[p]?.progress || {}; const tt = ebTotals(pr); const pc = Math.round(100*tt.d/tt.t);
    app.querySelector('#ering').style.setProperty('--v',pc); app.querySelector('#epct').textContent=pc+'%';
    app.querySelector('#esum').textContent=`${tt.d} de ${tt.t} capítulos lidos`;
    app.querySelector('#enext').textContent = tt.d===tt.t ? 'Tudo lido! 🎉' : 'Continuar de onde parei';
    app.querySelectorAll('.esec').forEach(sec=>{
      const st=tt.by[sec.dataset.k];
      sec.querySelector('.cnt').textContent=`${st.d}/${st.t}`;
      sec.querySelector('.pbar i').style.width=Math.round(100*st.d/st.t)+'%';
      sec.classList.toggle('full', st.d===st.t);
      sec.querySelectorAll('.chapli').forEach(l=>{ const on=l.querySelector('input').checked; l.classList.toggle('hide', filter==='todo' && on); l.querySelector('.chap').classList.toggle('rd', on); });
    });
  };
  const save = (k)=>{
    const prof=ensure(); const pr=prof.progress; const all=CHAPTERS[k].every((_,i)=>pr[chKey(k,i)]);
    if(all) pr['eb-'+k]=true; else delete pr['eb-'+k];
    prof.savedAt=new Date().toISOString(); persist(p); refresh();
  };
  app.querySelectorAll('.chap input').forEach(inp=>inp.addEventListener('change',()=>{
    const k=inp.dataset.k, i=+inp.dataset.i, pr=ensure().progress;
    if(inp.checked) pr[chKey(k,i)]=true; else delete pr[chKey(k,i)];
    save(k);
    if(inp.checked && ebTotals(pr).by[k].d===CHAPTERS[k].length) toast('Seção concluída: '+EBOOK.find(e=>e.k===k).t);
  }));
  const ebCache = (state.ebCache ||= {});
  async function loadChapter(k,i){
    const id=`${k}-${i}`; if(ebCache[id]!==undefined) return ebCache[id];
    try{ const snap=await getDoc(doc(fs,'ebook',id)); ebCache[id]= snap.exists() ? snap.data().html : null; }
    catch(e){ console.error(e); return undefined; }
    return ebCache[id];
  }
  app.querySelectorAll('.ctb').forEach(btn=>btn.addEventListener('click', async ()=>{
    const li=btn.closest('.chapli'), box=li.querySelector('.ebtxt'), k=li.dataset.k, i=+li.dataset.i;
    const open = btn.getAttribute('aria-expanded')==='true';
    if(open){ btn.setAttribute('aria-expanded','false'); box.hidden=true; return; }
    btn.setAttribute('aria-expanded','true'); box.hidden=false;
    if(!box.dataset.ready){
      box.innerHTML='<p class="msg">Carregando…</p>';
      const html=await loadChapter(k,i);
      if(html) box.innerHTML = html + (readOnly?'':'<button type="button" class="btn done">Terminei este capítulo ✓</button>');
      else if(html===null) box.innerHTML='<p class="msg">O conteúdo deste capítulo ainda não foi importado. Avise o Vitor.</p>';
      else { box.innerHTML='<p class="msg">Não deu pra carregar agora. Confira a internet e toque de novo.</p>'; box.dataset.ready=''; return; }
      box.dataset.ready='1';
    }
    const d=box.querySelector('.done');
    if(d) d.onclick=()=>{ const cb=li.querySelector('input'); if(!cb.checked){ cb.checked=true; cb.dispatchEvent(new Event('change')); } btn.click(); li.scrollIntoView({behavior:'smooth',block:'center'}); };
  }));
  app.querySelectorAll('[data-all]').forEach(b=>b.onclick=()=>{ const k=b.dataset.all, pr=ensure().progress; CHAPTERS[k].forEach((_,i)=>pr[chKey(k,i)]=true);
    app.querySelectorAll(`.chap input[data-k="${k}"]`).forEach(x=>x.checked=true); save(k); toast('Seção marcada como lida'); });
  const imp=app.querySelector('#ebimp');
  if(imp) imp.onclick=async()=>{
    const f=app.querySelector('#ebfile').files[0], st=app.querySelector('#ebst'); if(!f){ st.textContent='Escolha o arquivo.'; return; }
    try{
      const data=JSON.parse(await f.text()); const ids=Object.keys(data); let n=0;
      for(let a=0;a<ids.length;a+=8){ const b=writeBatch(fs); ids.slice(a,a+8).forEach(id=>b.set(doc(fs,'ebook',id),{html:data[id],updatedAt:new Date().toISOString()})); await b.commit(); n+=Math.min(8,ids.length-a); st.textContent=`Importando… ${n}/${ids.length}`; }
      state.ebCache={}; st.textContent=`Pronto: ${ids.length} capítulos importados.`; toast('Conteúdo importado');
    }catch(e){ console.error(e); st.textContent='Falhou: '+(e.code||e.message); }
  };
  app.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{ filter=c.dataset.f; app.querySelectorAll('.chip').forEach(x=>x.setAttribute('aria-pressed',String(x===c))); refresh(); });
  app.querySelector('#enext').onclick=()=>{
    const pr=state.profiles[p]?.progress||{};
    for(const E of EBOOK){ const i=CHAPTERS[E.k].findIndex((_,j)=>!pr[chKey(E.k,j)]); if(i>=0){
      const sec=app.querySelector(`.esec[data-k="${E.k}"]`); sec.open=true;
      const row=sec.querySelector(`.chap[data-i="${i}"]`); row.scrollIntoView({behavior:'smooth',block:'center'});
      row.animate([{background:'var(--dropout-soft)'},{background:'transparent'}],{duration:1600}); return; } }
    toast('Você já leu tudo');
  };
}

function summaryText(p, plan){
  const a=state.profiles[p].answers; const v=plan.verdict;
  const {weeks, byId} = weekGroups(plan);
  const nextWk = ds(monday(new Date()));
  const m = weeks.get(nextWk) || weeks.values().next().value;
  const lines = m ? [...m.keys()].map(id=>'• '+byId[id].t).join('\n') : '';
  return `*Plano C-PRO I – ${PEOPLE[p]}*\n${v.tag}: prova ${fdl(v.date)}\nTotal: ~${fh(plan.total)} de estudo, ${a.hours}h/semana\nFim do conteúdo + simulados: ${fdl(plan.sch.end)}\n\n*Esta semana:*\n${lines}`;
}
async function copyText(t){
  try{ await navigator.clipboard.writeText(t); toast('Resumo copiado'); }
  catch(e){ const ta=document.createElement('textarea'); ta.value=t; document.body.appendChild(ta); ta.select(); try{ document.execCommand('copy'); toast('Resumo copiado'); }catch(_){ toast('Não deu pra copiar neste navegador'); } ta.remove(); }
}

function renderCompare(){
  const ps = Object.keys(PEOPLE).filter(p=>state.profiles[p]?.answers);
  if(ps.length<2){
    const falta = Object.keys(PEOPLE).filter(p=>!state.profiles[p]?.answers).map(p=>PEOPLE[p]).join(' e ');
    app.innerHTML = `<div class="empty"><p><strong>Falta o cartão inicial de ${falta}.</strong></p><p>Quando as duas responderem, aparece aqui a data de prova que serve pras duas e quais aulas dá pra assistir juntas.</p></div>`;
    return;
  }
  const plans = Object.fromEntries(ps.map(p=>[p, computePlan(state.profiles[p].answers)]));
  const later = ps.reduce((x,p)=> plans[p].verdict.date > plans[x].verdict.date ? p : x, ps[0]);
  const common = plans[later].verdict.date;
  // overlap: aulas na mesma semana
  const g = Object.fromEntries(ps.map(p=>[p, weekGroups(plans[p])]));
  const overlap=[];
  for(const [wk,m] of g[ps[0]].weeks){
    const m2 = g[ps[1]].weeks.get(wk); if(!m2) continue;
    const same = [...m.keys()].filter(id=>m2.has(id) && g[ps[0]].byId[id].kind==='aula');
    if(same.length) overlap.push([wk, same.map(id=>g[ps[0]].byId[id].t)]);
  }
  app.innerHTML = `
    <div class="cmp">${ps.map(p=>{const pl=plans[p]; const pr=state.profiles[p].progress||{}; const d=pl.items.filter(i=>pr[i.id]).reduce((s,i)=>s+i.h,0);
      return `<div class="card"><h3>${PEOPLE[p]}</h3>
        <div class="v-tag" style="color:var(--${pl.verdict.cls==='ok'?'ok':pl.verdict.cls==='warn'?'warn':pl.verdict.cls==='bad'?'bad':'dropout'})">${pl.verdict.tag}</div>
        <p style="margin:4px 0">Prova: <strong>${fdl(pl.verdict.date)}</strong></p>
        <p style="margin:4px 0;color:var(--muted)">~${fh(pl.total)} de estudo · ${state.profiles[p].answers.hours}h/semana · ${Math.round(100*d/pl.total)}% feito</p></div>`;}).join('')}</div>
    <section class="verdict neutral"><div class="v-tag">Data que serve pras duas</div>
      <div class="v-date">${fdl(common)}</div>
      <p>É a data de ${PEOPLE[later]}, que tem o plano mais longo. Quem terminar antes usa a sobra em simulado, que é o que mais faz diferença nessa prova.</p></section>
    <h2>Aulas que dá pra assistir juntas</h2>
    <p style="color:var(--muted)">Combinem horário: a conta é compartilhada e duas pessoas logadas ao mesmo tempo podem travar o acesso. Assistir junto resolve isso e ainda rende discussão.</p>
    ${overlap.length? overlap.map(([wk,ts])=>`<div class="week" ><div style="padding:12px 16px"><strong>Semana de ${fd(pd(wk))}</strong><div style="color:var(--muted)">${ts.map(esc).join(', ')}</div></div></div>`).join('') : '<p>Os ritmos estão diferentes demais pra coincidir semana a semana. Dá pra combinar pelo menos os simulados de treino.</p>'}`;
}

const BOOK_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v16H6.5A2.5 2.5 0 0 0 4 21.5z"/><path d="M4 21.5V5.5"/></svg>';
function updateFab(){
  const f=document.getElementById('fab'); if(!f) return;
  if(!state.user || state.cur==='cmp'){ f.hidden=true; return; }
  const ed = state.profiles[state.cur];
  if(state.view==='ebook'){ f.innerHTML='← Voltar ao plano'; }
  else { const t=ebTotals(ed?.progress||{}); f.innerHTML=`${BOOK_SVG}E-book <small>${t.d}/${t.t}</small>`; }
  f.hidden=false;
}
document.getElementById('fab').onclick=()=>{ state.view = state.view==='ebook' ? 'plan' : 'ebook'; render(); window.scrollTo({top:0}); };
function render(){
  if(!state.user) return;
  document.querySelectorAll('.who button').forEach(b=>b.setAttribute('aria-pressed', String(b.dataset.p===state.cur)));
  updateFab();
  if(state.cur==='cmp') return renderCompare();
  const p = state.cur;
  if(!state.loaded[p]){ app.innerHTML='<div class="empty"><p>Carregando…</p></div>'; return; }
  if(state.view==='ebook') return renderEbook(p, !canEdit(p));
  const has = !!state.profiles[p]?.answers;
  if(!canEdit(p)){
    if(!has){ app.innerHTML=`<div class="empty"><p><strong>${PEOPLE[p]} ainda não respondeu o cartão inicial.</strong></p><p>O plano dela aparece aqui assim que ela responder.</p></div>`; return; }
    return renderPlan(p, true);
  }
  if(!has || state.editing[p]) renderForm(p); else renderPlan(p, false);
}
document.querySelectorAll('.who button').forEach(b=>b.onclick=()=>{ state.cur=b.dataset.p; render(); });

</script>
</body>
</html>
